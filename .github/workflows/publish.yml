name: Release

# Every push to main updates the release PR (version, CHANGELOG, CITATION.cff).
# Merging the release PR creates the tag and GitHub release, signs the package
# with Unity and publishes the signed tarball to npm.
#
# Keep the file name: npm trusted publishing is configured for publish.yml.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN: PRs, pushes and tags made
      # with GITHUB_TOKEN do not trigger workflows, so the release PR would get
      # no checks and could never be merged.
      - name: Create release bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Update release PR or create release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # release-please updates the version in CITATION.cff but not the date.
      - name: Check out the release PR
        id: release-pr
        if: steps.release.outputs.prs_created == 'true' && steps.release.outputs.pr != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set date-released in the release PR
        if: steps.release-pr.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          today=$(date -u +%F)
          sed -i -E "s/^date-released: .*/date-released: $today/" CITATION.cff
          if git diff --quiet; then
            echo "date-released is already $today"
            exit 0
          fi
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -am "chore: set date-released to $today"
          git push

  publish:
    name: Sign and publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    # Holds the Unity secrets. Restrict it to the main branch in the repo settings.
    environment: release
    permissions:
      contents: write # upload the signed tarball to the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      # Update both together. The checksum is pinned here instead of read from
      # the same CDN, so a tampered download fails the job.
      UPM_CLI_VERSION: v9.36.0
      UPM_CLI_SHA256: a7c00db477daa4161f24bf0af5d2589e88f3e6276f9798d44bae601d957dbe04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Check tag matches package.json
        run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Install UPM CLI
        run: |
          zip="$RUNNER_TEMP/upm-linux-x64.zip"
          curl -fsSL -o "$zip" "https://cdn.packages.unity.com/upm-cli/releases/$UPM_CLI_VERSION/upm-linux-x64.zip"
          echo "$UPM_CLI_SHA256  $zip" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP/upm"
          chmod +x "$RUNNER_TEMP/upm/UnityPackageManager"
          echo "$RUNNER_TEMP/upm" >> "$GITHUB_PATH"

      - name: Pack and sign
        env:
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORG_ID: ${{ secrets.UPM_ORG_ID }}
        run: |
          UnityPackageManager --version
          UnityPackageManager pack . --organization-id "$UPM_ORG_ID" --destination "$RUNNER_TEMP/out"

      - name: Verify signed tarball
        id: tarball
        run: |
          shopt -s nullglob
          files=("$RUNNER_TEMP"/out/*.tgz)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::Expected one .tgz in the pack output, found ${#files[@]}"
            exit 1
          fi
          tgz="${files[0]}"
          contents="$RUNNER_TEMP/contents.txt"
          tar -tzf "$tgz" | sed 's|^\./||' > "$contents"
          for required in package/package.json package/.attestation.p7m; do
            if ! grep -qx "$required" "$contents"; then
              echo "::error::$required is missing from $(basename "$tgz")"
              exit 1
            fi
          done
          if grep -q '^package/\.git/' "$contents"; then
            echo "::error::The tarball contains the .git folder"
            exit 1
          fi
          packed=$(tar -xzOf "$tgz" package/package.json | jq -r .version)
          if [ "v$packed" != "$TAG" ]; then
            echo "::error::Tarball version $packed does not match tag $TAG"
            exit 1
          fi
          echo "$(wc -l < "$contents") entries in $(basename "$tgz")"
          echo "path=$tgz" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@11

      # Publish the signed tarball as is. Publishing the folder would pack an
      # unsigned tarball.
      - name: Publish to npm
        env:
          TGZ: ${{ steps.tarball.outputs.path }}
        run: npm publish "$TGZ"

      - name: Attach signed tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TGZ: ${{ steps.tarball.outputs.path }}
        run: gh release upload "$TAG" "$TGZ" --repo "$GITHUB_REPOSITORY"
