name: Publish to npm

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

# npm trusted publishing: GitHub's OIDC token replaces NPM_TOKEN
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      # Trusted publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@11

      - name: Publish to npm
        run: npm publish
